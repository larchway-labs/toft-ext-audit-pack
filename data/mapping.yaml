  # ============================================ 03.11 Risk Assessment
  "03.11.01":
    responsibility: shared
    summary: Launchpad supplies estate-wide inputs; the assessment is yours.
    mechanism: >
      Three estate reads and a package inventory give a risk assessment its
      inventory inputs: what runs, where it is addressable, what each app holds,
      and what every app depends on.
    customer: >
      Performing and recording the risk assessment is organizational.
    evidence: [estate_reach, estate_targets, estate_languages, dependency_inventory, dependency_findings]
    odp:
      A.03.11.01.ODP.01:
        note: Organization-defined risk assessment frequency.

  "03.11.02":
    responsibility: shared
    summary: Dependency scanning is built in and honest about its limits; host and app scanning is yours.
    mechanism: >
      The dependency policy reads names and versions, not the app's code — and
      the product says so rather than overselling it. Recorded is not scanned and
      matched is not covered: there are three rungs of coverage, R sits on the
      middle one, and the inventory is written before any of the questions is
      asked. The sweep says that it ran — a row every pass whether or not
      anything changed, written at the moment of the reading because it cannot be
      taken again. A stale feed never blocks, and this install's package list
      never leaves. Separately, the platform publishes what to scan: one row per
      app with its address and effective visibility, admin or deploy-key only,
      and a scan is never counted as usage.
    customer: >
      Scanning the host, the images and the running applications themselves is
      yours. Launchpad tells a scanner where to point.
    evidence: [dependency_findings, dependency_inventory, setting_dependency_policy, estate_targets, install_checks]
    odp:
      A.03.11.02.ODP.01:
        evidence: setting_dependency_policy
        field: dependency_scan_interval_hours
        note: The interval at which the estate is re-checked against the advisory feed.
    refs: ["invariants: Dependency policy", "invariants: The estate as a scan target"]

  "03.11.04":
    responsibility: shared
    summary: Blocking thresholds and waivers are the platform's risk response; the decision is yours.
    mechanism: >
      The policy has a block threshold, a separate malware switch that is off by
      default and is not the block threshold, and waivers with a maximum life —
      there is no permanent waiver. A serving app is never stopped except for
      malware on that switch, as one guarded transition attributed to the system,
      never a re-lock, and an unlock the next pass undoes unless somebody signs a
      waiver. A restart is not a deploy: the verdict is the release's, not
      today's.
    customer: >
      Accepting a risk is authorization-shaped, which is why granting a waiver is
      refused to every API key. A human administrator makes that call and it is
      audited.
    evidence: [setting_dependency_policy, dependency_findings, audit_by_category]
    refs: ["invariants: Dependency policy"]

  # ============================ 03.12 Security Assessment and Monitoring
  "03.12.01":
    responsibility: shared
    summary: The install can diagnose itself and describe its own attack surface.
    mechanism: >
      The checks page is the install's self-diagnosis, computed per request and
      stored nowhere, with a rule its own list is the specification for: only
      reads, never a third party, skip over warn, a check the platform could not
      ask is not a bad answer, and no detail carries a credential. The router can
      also describe itself as an OpenAPI document generated from the same walk
      the routes command uses, so it cannot drift from what is served — a target
      list, not an API contract.
    customer: >
      The assessment itself, and its plan, are organizational.
    evidence: [install_checks, openapi, estate_targets]
    odp:
      A.03.12.01.ODP.01:
        note: Organization-defined assessment frequency.
    refs: ["invariants: Optional capabilities", "invariants: The estate as a scan target"]

  "03.12.02":
    responsibility: customer
    summary: Launchpad holds findings, not a POA&M.
    customer: >
      A plan of action and milestones is a document your organization maintains.
      The dependency findings and the checks page are inputs to it; there is no
      POA&M object in Launchpad.
    evidence: [dependency_findings, install_checks]

  "03.12.03":
    responsibility: shared
    summary: Continuous monitoring exists as reads and exports; the programme is yours.
    mechanism: >
      The dependency watch re-checks the estate on an interval and records that
      it ran. Telemetry is exported, never resident, and never load-bearing —
      names and attributes are a contract, cardinality is budgeted, and the
      budget is code. The scrape endpoint gets its own listener and is never a
      path on the platform's origin, because on a single-origin install an app's
      JavaScript would read it as the viewer.
    customer: >
      Defining and running the continuous monitoring programme is organizational.
    evidence: [telemetry_settings, setting_dependency_policy, install_checks, audit_recent, processes]
    refs: ["invariants: Telemetry"]

  "03.12.05":
    responsibility: shared
    summary: Every external seam is named and optional; the agreements are yours.
    mechanism: >
      Every seam names a backend and no seam names a cloud. A connection is
      welded to its scope and a new scope is a new connection. A URL somebody
      typed is server-side input, refused at save and at dial. A chosen
      destination that stops working fails; it never falls back.
    customer: >
      Interconnection agreements with the systems named in this evidence are
      organizational documents.
    evidence: [integration_settings, telemetry_settings, email_settings, git_connections, storage_resources, estate_reach]
    odp:
      A.03.12.05.ODP.01:
        evidence: estate_reach
        note: >
          The systems exchanged with are enumerated from the live integration,
          telemetry, mail, git and storage configuration rather than asserted.
    refs: ["invariants: The integration catalog", "invariants: Optional capabilities"]

  # ================= 03.13 System and Communications Protection
  "03.13.01":
    responsibility: shared
    summary: Origin isolation is the platform's boundary; the network boundary is the cluster's.
    mechanism: >
      The platform serves on one origin and deployed apps are proxied on another
      — a different origin on the same host — so an app's JavaScript is not the
      platform's JavaScript. Which responses are the platform's own is decided by
      resolving the app, never by matching the path. Who may frame an app is the
      install's answer and the default is the install itself; empty is not
      anyone. The Prometheus scrape endpoint gets a listener of its own and is
      never a path on the platform's origin. X-Forwarded-* is believed only from
      a trusted proxy, and an install works out its own inbound address rather
      than being told it.
    customer: >
      The perimeter in front of Launchpad — ingress, WAF, allowed networks — is
      yours.
    evidence: [install_settings, estate_targets, install_identity, install_checks]
    refs: ["invariants: Process and network boundaries", "ADR §31"]

  "03.13.04":
    responsibility: shared
    summary: Isolated mode separates apps by container; shared mode's app-to-app boundary is an accepted risk, stated.
    mechanism: >
      Execution mode is `shared` or `isolated`, never a backend name, and the
      effective mode belongs to the deployment. In shared mode each app runs
      under its own account, per-app secrecy on disk is enforced by a directory
      the app does not own rather than by a mode bit on one it does, and apps
      bind 127.0.0.1 only. A workload is never handed os.Environ(). Each app gets
      a scratch directory that is never shared and nothing an app writes there
      survives its process.
    customer: >
      App-to-app isolation in SHARED mode is an accepted risk and this project
      says so rather than hiding it — origin isolation must never be cited as
      evidence against it. If apps process CUI at differing sensitivities, run
      them in isolated mode and assess the cluster's policy engine. This is the
      second most important shared-responsibility item in this document.
    evidence: [processes, estate_targets, estate_reach, install_checks]
    refs: ["invariants: Process and network boundaries", "invariants: The workload seam"]

  "03.13.06":
    responsibility: shared
    summary: Deny-by-default is real in isolated mode and is a cluster-creation decision.
    mechanism: >
      In isolated mode each workload gets a NetworkPolicy admitting ingress only
      from the platform's own pods, matched on a pod label that is compiled into
      the binary and must never be templated. The metadata block's isolated half
      is written and never verified, because whether a NetworkPolicy is enforced
      at all depends on the cluster's policy engine.
    customer: >
      The policy engine is a cluster-CREATION decision — on AKS it cannot be added
      to an existing cluster. If it is absent, the policies Launchpad writes are
      inert and deny-by-default is not met. Verify it at the cluster and record
      the result; the platform deliberately does not claim to have checked.
    evidence: [processes, install_checks, estate_reach]
    refs: ["invariants: Process and network boundaries"]

  "03.13.08":
    responsibility: shared
    summary: Secrets are encrypted at rest by the platform; transport is the ingress's.
    mechanism: >
      At-rest: every scheme names its key completely and Key Vault's version is
      not optional; every ciphertext names the key that wrote it in one record
      format across both backends, and only the crypto package parses it. One key
      writes, every key in the ring reads, and a key that is not held is refused
      by name. Presence decides the backend and there is no runtime fallback. No
      key reaches a workload. Session cookies are HTTP-only.
    customer: >
      TLS termination, its cipher suites and its certificate lifecycle are the
      ingress's. Launchpad does not terminate TLS itself in the supported
      deployments and must not be cited as the transport control.
    evidence: [install_checks, install_settings, storage_resources]
    refs: ["invariants: At-rest encryption"]

  "03.13.09":
    responsibility: platform
    summary: Both session clocks end the session at the server, on every request.
    mechanism: >
      The idle timeout and the absolute ceiling are both enforced on every
      request rather than baked into the token, at five enforcement points, and
      both apply to sessions already outstanding.
    evidence: [setting_sessions]
    odp:
      A.03.13.09.ODP.01:
        evidence: setting_sessions
        field: session_idle_minutes
        note: The period of inactivity after which the session is terminated.
    refs: ["invariants: Identity"]

  "03.13.10":
    responsibility: platform
    summary: A key ring with a derived id, one writer, and a refusal by name for a key not held.
    mechanism: >
      The key id is derived, never configured. One key writes and every key in
      the ring reads, so a rotation does not strand old ciphertext. Retiring a key
      is not revoking it. Presence decides the backend — a cloud KMS or Key Vault
      where configured, and a local scheme that is a peer rather than a fallback.
      Rotation has a second half: a subcommand that sweeps the old key out so it
      can be dropped.
    evidence: [install_checks, install_settings]
    odp:
      A.03.13.10.ODP.01:
        note: >
          Key management requirements are the backend's — KMS, Key Vault, or the
          local scheme. Which backend is in use is read from the checks.
    refs: ["invariants: At-rest encryption"]

  "03.13.11":
    responsibility: shared
    summary: The platform uses the backend's cryptography; FIPS validation is the backend's and the host's.
    mechanism: >
      Cryptographic operations are the configured backend's — a cloud KMS, Key
      Vault, or the local scheme — and the record format names the key that wrote
      each ciphertext so the algorithm in force is never ambiguous.
    customer: >
      If your assessment requires FIPS-validated cryptography, that property
      belongs to the KMS or Key Vault backend and to the host's crypto libraries.
      Launchpad does not assert FIPS validation and must not be cited for it.
    evidence: [install_checks, install_settings]
    odp:
      A.03.13.11.ODP.01:
        note: >
          The cryptography used is the configured backend's; Launchpad makes no
          FIPS claim of its own.
    refs: ["invariants: At-rest encryption"]

  "03.13.12":
    responsibility: customer
    summary: Not a platform concern.
    customer: >
      Collaborative computing devices — cameras, microphones — are endpoint
      controls. Launchpad has no such device surface.
    odp:
      A.03.13.12.ODP.01:
        note: Not applicable to Launchpad.

  "03.13.13":
    responsibility: shared
    summary: Apps serve their own JavaScript on their own origin, and framing is an install decision.
    mechanism: >
      Deployed apps are served on a different origin from the platform, which is
      what keeps an app's JavaScript from being the platform's. Who may frame an
      app is the install's answer and the default is the install itself; empty is
      not anyone. A notebook is executed once at build time and served from a
      directory the platform owns rather than from the release.
    customer: >
      Deciding which mobile code your organization permits inside deployed apps
      is your policy; Launchpad hosts what your developers deploy and applies the
      source policy to its provenance, not to its content.
    evidence: [install_settings, estate_targets, source_policy]
    refs: ["invariants: Process and network boundaries", "invariants: Static hosting"]

  "03.13.15":
    responsibility: platform
    summary: Sessions are signed cookies with two server-side clocks; a workload's role assertion is signed per start.
    mechanism: >
      Session authenticity rests on a signed HTTP-only cookie whose validity is
      re-decided on every request rather than trusted from its own claims. The
      role a forwarded request carries is signed per app and per start, derived
      and never stored — absent, unverifiable and expired are one word, and that
      word refuses. Stripping the header answers the visitor and not the
      neighbour on loopback, which is why it is signed at all.
    evidence: [setting_sessions, estate_reach, processes]
    refs: ["invariants: The caller's role", "invariants: Identity"]

  # ================ 03.14 System and Information Integrity
  "03.14.01":
    responsibility: shared
    summary: Flaw remediation is the dependency policy for apps; patching the platform is a release you install.
    mechanism: >
      For the apps: an inventory written before any question is asked, matched
      against an advisory feed, with a block threshold that refuses a deploy, a
      waiver system with a maximum life and no permanent waiver, and a sweep that
      records that it ran on every pass. A stale feed never blocks. For the
      platform: a single versioned image, never tagged latest, and an install
      that reports its own version and build revision.
    customer: >
      Deciding when to install a new Launchpad release, and patching the host and
      the cluster, is yours. Launchpad does not update itself.
    evidence: [setting_dependency_policy, dependency_findings, dependency_inventory, install_identity, install_checks]
    odp:
      A.03.14.01.ODP.01:
        evidence: setting_dependency_policy
        field: dependency_scan_interval_hours
        note: How often the estate is re-checked for newly published advisories.
    refs: ["invariants: Dependency policy"]

  "03.14.02":
    responsibility: shared
    summary: Malware is handled as its own thing, not as a severity, and the stop switch is off by default.
    mechanism: >
      Malware is not a severity — it is a separate finding class with a separate
      switch, and that switch is not the block threshold. It is the one condition
      that may stop a serving app, as one guarded transition attributed to the
      system, never a re-lock, and an unlock the next pass undoes unless somebody
      signs a waiver. It is off by default, so an install that wants this
      behaviour has chosen it.
    customer: >
      Anti-malware on the host and in the images is yours. Launchpad's malware
      handling is about declared dependencies, not about scanning file content.
    evidence: [setting_dependency_policy, dependency_findings, audit_by_category]
    odp:
      A.03.14.02.ODP.01:
        evidence: setting_dependency_policy
        field: dependency_block_malware
        note: >
          Whether this install stops a serving app on a malware finding. Off by
          default and reported as it actually is.
    refs: ["invariants: Dependency policy"]

  "03.14.03":
    responsibility: shared
    summary: The advisory feed is the alert channel, and it works without outbound HTTPS.
    mechanism: >
      Advisories arrive from a configured feed with an interval and a maximum
      age, and a stale feed never blocks. For an install with no outbound HTTPS —
      which this product treats as its customer rather than an edge case — the
      corpus can be imported from a file by an operator subcommand. The feed
      credential is its own encrypted document and is write-only.
    customer: >
      Receiving and acting on vendor and government advisories about the platform
      itself, the host and the cluster is organizational.
    evidence: [setting_dependency_policy, dependency_findings, install_checks]
    refs: ["invariants: Dependency policy"]

  "03.14.06":
    responsibility: shared
    summary: The platform monitors apps and exports telemetry; network monitoring is yours.
    mechanism: >
      Each app has a durable platform-side account of itself — the platform's own
      voice about the app, kept per app, where narration is stage marks and never
      a stream and no error value reaches the verb. Failures are recorded out of
      the request path. Live workloads, their status, restarts and where measured
      their CPU and memory are readable estate-wide, where a metric a backend does
      not measure is absent rather than zero. Telemetry is exported, never
      resident.
    customer: >
      Network-level intrusion detection and host monitoring are yours.
    evidence: [processes, audit_recent, telemetry_settings, install_checks, dependency_findings]
    refs: ["invariants: Telemetry", "invariants: The workload seam", "invariants: Data path"]

  "03.14.08":
    responsibility: shared
    summary: Retention resolves in one place and every dial is readable.
    mechanism: >
      Retention resolves in one place rather than being reimplemented per caller.
      The operational retention dials — app events, job logs and runs, scheduled
      logs and runs, announcement recipients, dependency scan history — are
      readable settings with working defaults. An app's own data document is one
      JSON document and not a store: no keys, no listing, no queries, 256 KiB,
      and the bytes are the app's, stored as text and never read.
    customer: >
      Deciding the retention periods your CUI requires, and applying them to data
      inside your apps, is yours. Launchpad retains its own records, not your
      application data.
    evidence: [setting_retention, install_settings, estate_reach]
    odp: {}
    refs: ["invariants: Data path", "invariants: App data"]

  # ================================================ 03.15 Planning
  "03.15.01":
    responsibility: customer
    summary: Policies and procedures are yours; this pack is an input.
    customer: >
      Launchpad holds no policy documents. This pack exists to be cited by them.
    odp:
      A.03.15.01.ODP.01:
        note: Organization-defined policy review frequency.

  "03.15.02":
    responsibility: shared
    summary: Launchpad supplies the system description an SSP needs; the SSP is yours.
    mechanism: >
      The component inventory, the addressable surface, the reach of every app,
      the served route list and the install's own version and configuration are
      all readable and are collected by this pack. Those are the sections of a
      system security plan that go stale fastest, and here they are generated
      rather than transcribed.
    customer: >
      Authoring and maintaining the SSP is yours. Regenerate this pack when the
      estate changes and attach it.
    evidence: [install_identity, install_settings, estate_languages, estate_targets, estate_reach, openapi, processes]
    odp:
      A.03.15.02.ODP.01:
        note: Organization-defined SSP review frequency.

  "03.15.03":
    responsibility: customer
    summary: Not a platform concern.
    customer: >
      Rules of behavior are an organizational document users acknowledge.
      Launchpad has no acknowledgement surface.
    odp:
      A.03.15.03.ODP.01:
        note: Organization-defined frequency for review and re-acknowledgement.

  # ============================ 03.16 System and Services Acquisition
  "03.16.01":
    responsibility: platform
    summary: The product's design rules are written down, indexed, and enforced by tests.
    mechanism: >
      This platform keeps an explicit set of invariants — the rules a change has
      to keep — each stated in full, indexed, and in many cases enforced by a
      test whose failure is a build failure. Several are stated as "the list is
      the specification", which means the enumeration in the code IS the control
      and drift is caught mechanically rather than by review. Least privilege,
      fail-closed refusal, 404-over-403, absent-not-dormant and never-a-credential-value
      are among them.
    evidence: [openapi, install_checks]
    odp:
      A.03.16.01.ODP.01:
        note: >
          The security engineering principles applied are the documented
          invariants; they are a property of the build rather than a live
          reading.
    refs: ["invariants: index"]

  "03.16.02":
    responsibility: shared
    summary: The language census is the unsupported-component report, and a version is refused rather than approximated.
    mechanism: >
      Every build records which interpreter version it resolved, and the estate
      census reports apps grouped by the language and series their SERVING
      release resolved — admin-only, never answering less than it knows. A
      version is refused, never approximated, and the decision is made before the
      build because that is where the interpreter gets baked in. Patch never
      matters and a pin naming one is refused rather than truncated. The set of
      available versions is discovered rather than compiled in: the operator says
      where, and the probe says what.
    customer: >
      Deciding that a series has reached end of support, and scheduling the
      migration, is yours. Launchpad tells you exactly which apps are on it.
    evidence: [estate_languages, install_identity, dependency_inventory, install_checks]
    refs: ["invariants: Language versions"]

  "03.16.03":
    responsibility: shared
    summary: Every external service is an explicit, optional, named seam.
    mechanism: >
      Every seam names a backend and no seam names a cloud, and the platform
      never works out which one it is on. Absent, not dormant. A connection is
      welded to its scope. The far side's membership is the boundary. Vendor
      wires are individually switchable and off means no outbound request at all,
      with the endpoint compiled in and nothing that overrides it.
    customer: >
      Flowing your security requirements down to the providers named in this
      evidence is yours.
    evidence: [integration_settings, telemetry_settings, email_settings, git_connections, storage_resources, install_license]
    odp:
      A.03.16.03.ODP.01:
        note: >
          The external system services in use are enumerated live rather than
          asserted; an install may legitimately have none.
    refs: ["invariants: Optional capabilities", "invariants: The integration catalog"]

  # ==================================== 03.17 Supply Chain Risk Management
  "03.17.01":
    responsibility: shared
    summary: The platform gives supply chain risk a factual base; the plan is yours.
    mechanism: >
      Three facts feed a supply chain plan: what every app depends on, where
      every app's source came from, and what interpreter each release was built
      against. All three are readable estate-wide and admin-only.
    customer: >
      The plan itself is an organizational document.
    evidence: [dependency_inventory, source_policy, estate_languages, git_connections]
    odp:
      A.03.17.01.ODP.01:
        note: Organization-defined plan review frequency.

  "03.17.02":
    responsibility: shared
    summary: Provenance is constrained by allow-by-exception patterns with seven enforcement points.
    mechanism: >
      Trusted app sources constrain where code may come from, as a pure matcher
      behind one resolver with seven enforcement points whose list is the
      specification. A connected git host is a HELD credential and no key may
      attach one; coverage is the boundary and it is checked at the write.
      Disable is immediate and unrefusable while remove is refused, naming the
      apps still using it. The gallery is a separate switch: off means no
      outbound request, the switch curates rather than contains, and a URL from
      the catalog is treated as server-side input.
    customer: >
      Choosing which sources to trust, and vetting them, is yours.
    evidence: [source_policy, git_connections, install_settings, estate_targets]
    refs: ["invariants: Trusted app sources", "invariants: The Gallery"]

  "03.17.03":
    responsibility: shared
    summary: Delivery artifacts are versioned and pinned; the requirements you flow down are yours.
    mechanism: >
      The delivery artifacts are published rather than assembled: one multi-arch
      image tagged with the version and never latest, a Helm chart, a one-box
      bundle with a drift guard, and CLI binaries published with no source. Five
      things compiled into the binary must never be templated in the chart, and
      that coupling is why the chart lives with the code. The dependency
      inventory is written before any question is asked, so what an app declared
      is recorded even where no advisory data covers it.
    customer: >
      Flowing supply chain requirements down to your own app developers, and
      verifying the artifacts you install, is yours.
    evidence: [dependency_inventory, install_identity, source_policy]
    odp:
      A.03.17.03.ODP.01:
        note: Organization-defined supply chain requirements to flow down.
    refs: ["ADR §34", "ADR §44", "ADR §67"]
